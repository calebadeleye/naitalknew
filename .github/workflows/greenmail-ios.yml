name: Green Mail iOS

# Builds the Green Mail phone app (mobile/) into a signed .ipa on a GitHub macOS
# runner and uploads it to App Store Connect, where it appears in TestFlight
# (install TestFlight on the iPhone to try it). Same set-up as the Luminary
# Radio iOS workflow: manual signing with a distribution certificate and an App
# Store provisioning profile for com.naitalk.greenmail; the App Store Connect
# API key is used only for the upload. Steps: mobile/IOS-RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (build number). Defaults to the workflow run number."
        required: false
        type: string
      submit:
        description: "Upload the .ipa to App Store Connect after building"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "greenmail-ios-v*"

concurrency:
  group: greenmail-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    env:
      EXPO_NO_TELEMETRY: "1"
      # --- required repo secrets (Settings -> Secrets and variables -> Actions) ---
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE: ${{ secrets.GREENMAIL_IOS_PROVISION_PROFILE }}
      BUNDLE_ID: com.naitalk.greenmail

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Verify required secrets are present
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 \
                   IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROVISION_PROFILE; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Normalize identifiers (strip stray whitespace/newlines)
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          {
            echo "APPLE_TEAM_ID=$(trim "$APPLE_TEAM_ID")"
            echo "ASC_KEY_ID=$(trim "$ASC_KEY_ID")"
            echo "ASC_ISSUER_ID=$(trim "$ASC_ISSUER_ID")"
          } >> "$GITHUB_ENV"
          echo "team=[$(trim "$APPLE_TEAM_ID")] keyId=[$(trim "$ASC_KEY_ID")] issuer=[$(trim "$ASC_ISSUER_ID")]"

      - name: Write App Store Connect API key (for upload)
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEY_FILE"
          if ! head -1 "$KEY_FILE" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::ASC_KEY_P8_BASE64 did not decode to a valid .p8 (no 'BEGIN PRIVATE KEY' header). Re-copy the secret with: base64 -i AuthKey_XXXX.p8 | tr -d '\\n' | pbcopy"
            exit 1
          fi
          echo "Decoded API key OK ($(wc -c < "$KEY_FILE") bytes) -> $KEY_FILE"

      - name: Import signing certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/["[:space:]]*//g')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Available codesigning identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        run: |
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/pp.mobileprovision"
          PP_PLIST="$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision")"
          UUID="$(echo "$PP_PLIST" | plutil -extract UUID raw -)"
          NAME="$(echo "$PP_PLIST" | plutil -extract Name raw -)"
          APPID="$(echo "$PP_PLIST" | plutil -extract Entitlements.application-identifier raw -)"
          PROFDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFDIR"
          cp "$RUNNER_TEMP/pp.mobileprovision" "$PROFDIR/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Installed profile: '$NAME'  ($UUID)  for  $APPID"
          case "$APPID" in
            *".$BUNDLE_ID") echo "profile matches $BUNDLE_ID" ;;
            *) echo "::error::Profile is for '$APPID', expected to end with .$BUNDLE_ID"; exit 1 ;;
          esac

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          for i in 1 2 3; do
            pod install --repo-update && break
            echo "pod install failed (attempt $i), retrying..."; sleep 15
          done

      - name: Resolve project metadata
        id: meta
        run: |
          WORKSPACE=$(cd ios && ls -d *.xcworkspace | head -1)
          PROJECT_NAME=$(basename "$WORKSPACE" .xcworkspace)
          BUILD_NUMBER="${{ inputs.build_number }}"
          [ -n "$BUILD_NUMBER" ] || BUILD_NUMBER="${{ github.run_number }}"
          {
            echo "workspace=ios/$WORKSPACE"
            echo "scheme=$PROJECT_NAME"
            echo "project_name=$PROJECT_NAME"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Workspace: ios/$WORKSPACE | Scheme: $PROJECT_NAME | Build #: $BUILD_NUMBER"

      - name: Set build number
        run: |
          PLIST="ios/${{ steps.meta.outputs.project_name }}/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.meta.outputs.build_number }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ steps.meta.outputs.build_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      - name: Force manual signing on the app target
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby - "${{ steps.meta.outputs.project_name }}" "$APPLE_TEAM_ID" "$PROFILE_NAME" <<'RUBY'
          require 'xcodeproj'
          name, team, profile = ARGV
          path = Dir["ios/#{name}.xcodeproj"].first or abort "xcodeproj not found"
          project = Xcodeproj::Project.open(path)
          target = project.targets.find { |t| t.name == name } or abort "target #{name} not found"
          target.build_configurations.each do |c|
            bs = c.build_settings
            bs["CODE_SIGN_STYLE"] = "Manual"
            bs["DEVELOPMENT_TEAM"] = team
            bs["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            bs["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            bs["PROVISIONING_PROFILE_SPECIFIER"] = profile
          end
          attrs = (project.root_object.attributes["TargetAttributes"] ||= {})
          (attrs[target.uuid] ||= {})["ProvisioningStyle"] = "Manual"
          project.save
          puts "manual signing set on #{name}: team=#{team} profile=#{profile}"
          RUBY

      - name: Archive
        run: |
          if command -v xcbeautify >/dev/null 2>&1; then FMT=xcbeautify; else FMT=cat; fi
          set -o pipefail
          # App-target signing is baked into the pbxproj by the previous step.
          # Only the keychain hint and build number are passed here, so the Pods
          # project keeps its own (unsigned) settings and does not fight the
          # distribution profile.
          xcodebuild archive \
            -workspace "${{ steps.meta.outputs.workspace }}" \
            -scheme "${{ steps.meta.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            | $FMT

      - name: Export .ipa
        run: |
          if command -v xcbeautify >/dev/null 2>&1; then FMT=xcbeautify; else FMT=cat; fi
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            "<key>teamID</key><string>${APPLE_TEAM_ID}</string>" \
            '<key>signingStyle</key><string>manual</string>' \
            '<key>provisioningProfiles</key><dict>' \
            "<key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>" \
            '</dict>' \
            '<key>stripSwiftSymbols</key><true/>' \
            '<key>uploadSymbols</key><true/>' \
            '<key>destination</key><string>export</string>' \
            '</dict></plist>' > "$RUNNER_TEMP/exportOptions.plist"
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | $FMT
          ls -la "$RUNNER_TEMP/export"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenmail-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.submit != false }}
        run: |
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          echo "Uploading $IPA"
          set -o pipefail
          if xcrun altool --upload-app \
               --file "$IPA" \
               --type ios \
               --apiKey "$ASC_KEY_ID" \
               --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"; then
            echo "Upload succeeded."
          else
            echo "::error::altool upload failed. If this is a 401/NOT_AUTHORIZED, the App Store Connect API key (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64) is wrong, revoked, or lacks the App Manager role."
            exit 1
          fi
          if grep -qiE 'NOT_AUTHORIZED|error:|ERROR ' "$RUNNER_TEMP/altool.log"; then
            echo "::error::altool reported errors despite exit 0 — treating as failed."
            exit 1
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
